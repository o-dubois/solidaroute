<!-- ============================================================
     Gabarit : Réinitialisation du mot de passe
     Template: Password reset
     Variables :
       {{FIRST_NAME}}    — prénom de l'utilisateur / user's first name
       {{RESET_LINK}}    — lien de réinitialisation / reset link URL
       {{MSG_GREETING}}  — "Bonjour" ou "Hello"
       {{MSG_INTRO}}     — description de la demande / request description
       {{MSG_EXPIRY}}    — durée de validité du lien / link validity duration
       {{MSG_IGNORE}}    — "Si vous n'avez pas demandé..." / "If you didn't request..."
       {{BTN_RESET}}     — texte du bouton / button label
============================================================ -->

<h1 style="margin:0 0 8px;font-size:22px;color:#111827;font-weight:700;">
  {{MSG_GREETING}}, {{FIRST_NAME}} ! 🔐
</h1>

<p style="margin:0 0 20px;font-size:15px;color:#6b7280;line-height:1.6;">
  {{MSG_INTRO}}
</p>

<!-- Reset button -->
<table width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center" style="padding:8px 0 28px;">
      <a href="{{RESET_LINK}}"
         style="display:inline-block;background:#0d9488;color:#ffffff;
                font-size:16px;font-weight:600;text-decoration:none;
                padding:14px 36px;border-radius:10px;">
        {{BTN_RESET}}
      </a>
    </td>
  </tr>
</table>

<p style="margin:0 0 8px;font-size:13px;color:#9ca3af;line-height:1.5;">
  {{MSG_EXPIRY}}
</p>

<p style="margin:0;font-size:12px;color:#d1d5db;line-height:1.4;">
  {{MSG_IGNORE}}
</p>
