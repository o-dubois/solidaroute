<!-- ============================================================
     Gabarit : Diffusion aux conducteurs de la zone (broadcast)
     Variables :
       {{DRIVER_FIRST}}      — prénom du conducteur
       {{MSG_GREETING}}      — "Bonjour" ou "Hello"
       {{MSG_INTRO}}         — phrase d'intro
       {{MSG_REMINDER}}      — phrase rappel (si isReminder=true, sinon vide)
       {{MSG_DEADLINE}}      — phrase délai de réponse
       {{MSG_FALLBACK}}      — note de bas de page
       {{PICKUP}}            — adresse de départ
       {{DROPOFF}}           — adresse d'arrivée
       {{DEPARTURE}}         — date/heure formatée
       {{RETURN_ROW}}        — ligne retour (vide si aller simple)
       {{PASSENGERS_ROW}}    — ligne passagers (vide si 1 passager)
       {{TRIP_NUMBER}}       — numéro du trajet
       {{LABEL_PICKUP}}      — "Départ" ou "Pickup"
       {{LABEL_DROPOFF}}     — "Arrivée" ou "Drop-off"
       {{LABEL_DEPARTURE}}   — "Date et heure" ou "Date and time"
       {{APP_LINK}}          — lien vers /driver/available
       {{BTN_VIEW}}          — texte du bouton
============================================================ -->

<h1 style="margin:0 0 8px;font-size:22px;color:#111827;font-weight:700;">
  {{MSG_GREETING}} {{DRIVER_FIRST}} 👋
</h1>

{{MSG_REMINDER}}

<p style="margin:0 0 16px;font-size:15px;color:#6b7280;line-height:1.6;">
  {{MSG_INTRO}}
</p>

<!-- Bloc trajet -->
<table style="width:100%;border-radius:8px;background:#f0fdfa;border:1px solid #99f6e4;
              margin:16px 0;padding:16px;" cellpadding="8">
  <tr><td style="font-size:13px;color:#0f766e;line-height:1.8;">
    <strong>📍 {{LABEL_PICKUP}} :</strong> {{PICKUP}}<br>
    <strong>🏁 {{LABEL_DROPOFF}} :</strong> {{DROPOFF}}<br>
    <strong>📅 {{LABEL_DEPARTURE}} :</strong> {{DEPARTURE}}<br>
    {{RETURN_ROW}}
    {{PASSENGERS_ROW}}
    <strong>Nº :</strong> T-{{TRIP_NUMBER}}
  </td></tr>
</table>

<p style="margin:0 0 20px;font-size:14px;color:#6b7280;line-height:1.6;">
  {{MSG_DEADLINE}}
</p>

<!-- Bouton -->
<table width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center" style="padding:8px 0 28px;">
      <a href="{{APP_LINK}}"
         style="display:inline-block;background:#0d9488;color:#ffffff;
                font-size:16px;font-weight:600;text-decoration:none;
                padding:14px 36px;border-radius:10px;">
        {{BTN_VIEW}}
      </a>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:13px;color:#9ca3af;line-height:1.5;">
  {{MSG_FALLBACK}}
</p>
