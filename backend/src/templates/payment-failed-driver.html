<!-- ============================================================
     Template: Payment failed — driver notification
     Variables:
       {{DRIVER_FIRST}}    — driver's first name
       {{TRIP_NUMBER}}     — trip number (e.g. 42)
       {{PICKUP}}          — pickup address
       {{DROPOFF}}         — dropoff address
       {{DEPARTURE}}       — formatted departure date/time
       {{AMOUNT}}          — formatted amount (e.g. 6.34)
       {{CURRENCY}}        — currency code (e.g. CAD)
       {{CONTACT_EMAIL}}   — support email address
       {{MSG_GREETING}}    — localized greeting
       {{MSG_INTRO}}       — localized intro sentence
       {{MSG_CONTACT}}     — localized contact sentence
       {{LABEL_PICKUP}}    — localized "Pickup"
       {{LABEL_DROPOFF}}   — localized "Drop-off"
       {{LABEL_DEPARTURE}} — localized "Date and time"
       {{LABEL_CONTACT}}   — localized "Contact us"
============================================================ -->

<h1 style="margin:0 0 8px;font-size:22px;color:#111827;font-weight:700;">
  {{MSG_GREETING}}, {{DRIVER_FIRST}} ⚠️
</h1>

<p style="margin:0 0 16px;font-size:15px;color:#6b7280;line-height:1.6;">
  {{MSG_INTRO}}
</p>

<!-- Trip detail block -->
<table style="width:100%;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;
              margin:16px 0;padding:16px;" cellpadding="8">
  <tr><td style="font-size:13px;color:#991b1b;line-height:1.8;">
    <strong>📍 {{LABEL_PICKUP}} :</strong> {{PICKUP}}<br>
    <strong>🏁 {{LABEL_DROPOFF}} :</strong> {{DROPOFF}}<br>
    <strong>📅 {{LABEL_DEPARTURE}} :</strong> {{DEPARTURE}}<br>
    <strong>💳 :</strong> {{AMOUNT}} {{CURRENCY}}<br>
    <strong>Nº :</strong> T-{{TRIP_NUMBER}}
  </td></tr>
</table>

<p style="margin:0 0 16px;font-size:14px;color:#374151;line-height:1.6;">
  {{MSG_CONTACT}}
  <a href="mailto:{{CONTACT_EMAIL}}" style="color:#2563eb;">{{CONTACT_EMAIL}}</a>
</p>
