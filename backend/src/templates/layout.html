<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:32px 16px;">
    <tr><td align="center">
      <table width="100%" style="max-width:520px;background:#ffffff;border-radius:16px;
             box-shadow:0 2px 8px rgba(0,0,0,0.08);overflow:hidden;">

        <!-- ── Header ── -->
        <tr>
          <td style="background:#0d9488;padding:28px 32px;text-align:center;">
            <span style="color:#ffffff;font-size:22px;font-weight:bold;">🚗 {{APP_NAME}}</span>
          </td>
        </tr>

        <!-- ── Body ── -->
        <tr>
          <td style="padding:36px 32px;">
            {{BODY}}
          </td>
        </tr>

        <!-- ── Footer ── -->
        <tr>
          <td style="background:#f9fafb;padding:20px 32px;text-align:center;border-top:1px solid #e5e7eb;">
            <p style="margin:0;font-size:12px;color:#9ca3af;">
              © {{YEAR}} {{APP_NAME}}<br>
              {{FOOTER_TEXT}}
            </p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
